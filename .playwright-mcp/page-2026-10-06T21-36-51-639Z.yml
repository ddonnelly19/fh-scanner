        - heading "Track your Forza Horizon 6 car collection" [level=2] [ref=e23204]
        - paragraph [ref=e23205]: "Forza Horizon 6 ships with 622 cars and it's surprisingly easy to lose track of which ones you already own once the wheelspins, Car Pass drops and barn finds start piling up. This tracker is a simple, no-login checklist: tap a car the moment you unlock it and your collection percentage updates instantly."
        - paragraph [ref=e23206]: The views answer different questions. All Cars is the quickest overview, every car in one grid ordered by performance index. By Brand is for the completionists chasing a full manufacturer set. By Class shows where your garage is light, which helps when an event locks you to a specific PI class. By Rarity highlights the Epic and Legendary cars that are hardest to come by. Combine the Missing filter with any view to get an instant shopping list of what's left.